apiVersion: apps/v1
kind: Deployment
metadata:
  name: diaa-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diaa-app
  template:
    metadata:
      labels:
        app: diaa-app
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: diaa-config
